name: Завантаження PDF публікацій (тимчасово)
on:
  push:
    branches: [publikatsii]
    paths: ['_zavantazhennya/dzherela.json', '_zavantazhennya/zavantazhyty.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4
      - run: python3 _zavantazhennya/zavantazhyty.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add _zavantazhennya
          git commit -m "Завантажено PDF публікацій із сайтів журналів" || echo "Немає змін"
          git push
